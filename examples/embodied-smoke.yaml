# Minimal CPU smoke run. It checks the full headless pipeline, not training quality.
seed: 7
training_mode: batch
algorithm: genetic
execution_backend: torch
device: cpu
workers: 1
body_inputs: [hunger]
population_size: 2
prey_count: 1
predator_count: 0
hidden_nodes: 1
state_width: 2
mean_degree: 2.0
initial_state_scale: 0.12
network_dt: 0.05
max_delta: 0.12
edge_step_scale: 0.06
initial_energy_scale: 1.0
max_food: 20
food_growth_rate: 24.0
max_speed: 20.0
max_turn: 6.283185307179586
plant_cluster_count: 1
plant_cluster_radius: 5.0
batch_generations: 1
batch_episode_steps: 60
batch_trials: 1
batch_validation_trials: 1
batch_test_trials: 1
batch_opponents: 1
enforce_survival_pressure: true
