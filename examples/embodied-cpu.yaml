# YAML keys match the Embodied training panel in the dashboard.
seed: 41
training_mode: batch
algorithm: genetic
# Each of the 24 worlds contains 8 different prey genomes, yielding a
# 192-genome prey population per generation.  Use shared_rule_cohort to keep
# the legacy one-rule-per-world evaluation.
batch_population_mode: mixed_individual_population
execution_backend: torch
device: cpu
# Candidate evaluation processes. Set to the Slurm CPUs requested, or 0 to use
# the runner's automatic limit of up to eight workers.
workers: 24
body_inputs: [hunger]  # hunger, energy_change, ate, time_since_meal
population_size: 24
prey_count: 8
predator_count: 0
hidden_nodes: 26
state_width: 3
mean_degree: 4.0
initial_state_scale: 0.4
network_dt: 0.1
max_delta: 0.5
edge_step_scale: 0.08
initial_energy_scale: 5.0
max_food: 80
food_growth_rate: 30.0
max_speed: 10.0
max_turn: 9.0
plant_cluster_count: 4
plant_cluster_radius: 5.0

allow_input_output_connections: false

# Batch mode parameters.
batch_generations: 2000
batch_episode_steps: 300
batch_trials: 4
batch_validation_trials: 4
batch_test_trials: 8
batch_opponents: 2
enforce_survival_pressure: true

# Retained for an optional training_mode: continuous run.
ticks: 600
