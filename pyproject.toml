[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evolvable-state-network"
version = "0.1.0"
description = "Deterministic batched message-passing dynamical systems for evolvable stability experiments."
requires-python = ">=3.11"
authors = [{name = "Experimental Dynamics"}]
dependencies = [
    "numpy>=2.0", 
    "cma>=4.4", 
    "matplotlib>=3.10", 
    "plotly>=6.0",
    "torch>=2.13",
    "fastapi>=0.116,<1",
    "uvicorn>=0.35,<1",
    "platformdirs>=4.3,<5",
    "httpx>=0.28,<1"
]

[project.scripts]
esn-experiment = "evolvable_state_network.cli:main"
esn-dashboard = "evolvable_state_network.server:main"
esn-evolve = "evolvable_state_network.evolution_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evolvable_state_network = ["web/*.css", "web/*.html", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
